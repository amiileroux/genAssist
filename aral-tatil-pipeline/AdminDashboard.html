<div id="admin-root" class="max-w-7xl mx-auto p-4 sm:p-6">
  <header class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div>
      <h1 class="text-xl sm:text-2xl font-bold text-slate-900">ARAL &rarr; TATIL Lead Pipeline</h1>
      <p class="text-sm text-slate-500">Back-office vetting &amp; routing dashboard</p>
    </div>
    <div class="flex items-center gap-3">
      <div id="cutoff-badge" class="rounded-full px-4 py-2 text-sm font-semibold bg-amber-100 text-amber-800 border border-amber-200">
        Loading cutoff timer&hellip;
      </div>
      <button id="refresh-btn" class="rounded-md bg-slate-900 text-white text-sm font-medium px-3 py-2 hover:bg-slate-700">
        Refresh
      </button>
    </div>
  </header>

  <div id="line-tabs" class="flex gap-2 mb-6"></div>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6" id="status-summary"></div>

  <div class="overflow-x-auto rounded-lg border border-slate-200 bg-white shadow-sm">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-50 text-slate-600 text-left">
        <tr>
          <th class="px-3 py-2 font-medium">Client</th>
          <th class="px-3 py-2 font-medium">Agent</th>
          <th class="px-3 py-2 font-medium" id="category-col-header">Coverage Type</th>
          <th class="px-3 py-2 font-medium">Submitted</th>
          <th class="px-3 py-2 font-medium">Score</th>
          <th class="px-3 py-2 font-medium">Status</th>
          <th class="px-3 py-2 font-medium">Drive</th>
          <th class="px-3 py-2 font-medium">Actions</th>
        </tr>
      </thead>
      <tbody id="dashboard-body" class="divide-y divide-slate-100"></tbody>
    </table>
  </div>

  <p id="admin-empty" class="hidden text-center text-slate-400 py-10">No submissions yet.</p>
</div>

<div id="note-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-5">
    <h2 id="note-modal-title" class="text-lg font-semibold mb-2">Add a note</h2>
    <p id="note-modal-sub" class="text-sm text-slate-500 mb-3"></p>
    <textarea id="note-modal-text" rows="4" class="w-full rounded-md border border-slate-300 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" placeholder="Describe exactly what's missing or needed..."></textarea>
    <div class="flex justify-end gap-2 mt-4">
      <button id="note-modal-cancel" class="px-3 py-2 text-sm rounded-md border border-slate-300 hover:bg-slate-50">Cancel</button>
      <button id="note-modal-confirm" class="px-3 py-2 text-sm rounded-md bg-slate-900 text-white hover:bg-slate-700">Confirm</button>
    </div>
  </div>
</div>

<div id="policy-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-5">
    <h2 class="text-lg font-semibold mb-2">TATIL policy number</h2>
    <input id="policy-modal-input" type="text" class="w-full rounded-md border border-slate-300 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" placeholder="e.g. TATIL-MOT-00123">
    <div class="flex justify-end gap-2 mt-4">
      <button id="policy-modal-cancel" class="px-3 py-2 text-sm rounded-md border border-slate-300 hover:bg-slate-50">Cancel</button>
      <button id="policy-modal-confirm" class="px-3 py-2 text-sm rounded-md bg-emerald-600 text-white hover:bg-emerald-500">Mark Issued</button>
    </div>
  </div>
</div>
