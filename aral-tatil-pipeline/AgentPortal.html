<div id="agent-root" class="max-w-md mx-auto p-4 pb-24">
  <header class="mb-4">
    <h1 class="text-lg font-bold text-slate-900">ARAL Agent Portal</h1>
    <p class="text-xs text-slate-500">Your submissions &amp; outstanding documents</p>
  </header>

  <div id="agent-email-card" class="hidden bg-white border border-slate-200 rounded-lg p-4 mb-4">
    <label class="block text-sm font-medium text-slate-700 mb-1">Your agent email</label>
    <input id="agent-email-input" type="email" placeholder="you@aral.com" class="w-full rounded-md border border-slate-300 p-2 text-sm">
    <button id="agent-email-save" class="mt-2 w-full rounded-md bg-slate-900 text-white text-sm font-medium px-3 py-2">View my submissions</button>
  </div>

  <div id="agent-list" class="space-y-3"></div>
  <p id="agent-empty" class="hidden text-center text-slate-400 py-10">No submissions found for this email yet.</p>
</div>

<input type="file" id="agent-file-input" class="hidden" accept="image/*,.pdf">
