<script>
(function () {
  var LINES = [
    { key: 'ALL', label: 'All' },
    { key: 'MOTOR', label: '🚗 Motor' },
    { key: 'PROPERTY', label: '🏠 Property' }
  ];

  var state = { email: '', records: [], pendingUpload: null, lineFilter: 'ALL' };

  function $(id) { return document.getElementById(id); }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function statusColor(status) {
    switch (status) {
      case 'Ready for Underwriting': return 'bg-aral-light/20 text-aral-dark';
      case 'Needs Supplemental Info': return 'bg-amber-100 text-amber-800';
      case 'Policy Issued': return 'bg-aral-dark/10 text-aral-dark';
      default: return 'bg-rose-100 text-rose-800';
    }
  }

  var DOC_LABELS = {
    dpLicence: 'DP Licence',
    certifiedCopy: 'Certified Copy',
    proofOfAddress: 'Proof of Address',
    ncdLetter: 'NCD Letter',
    claimHistoryLetter: 'Claim History Letter',
    certOfRegistration: 'Certificate of Registration (business)',
    directorsIdDp: 'Directors ID & DP',
    propertyImage: 'Property Image',
    propertyEvaluationReport: 'Property Evaluation Report',
    signedApplication: 'Signed Application',
    paymentProof: 'Payment Proof'
  };

  var POLICY_STAGE = {
    FORMS_SENT: 'Forms Sent - Awaiting Signature',
    SIGNED_PENDING_APPROVAL: 'Signed - Pending ARAL Approval',
    APPROVED_PENDING_PAYMENT: 'Approved - Payment Link Sent',
    PAYMENT_PENDING_CONFIRMATION: 'Payment Submitted - Pending Confirmation',
    POLICY_CONFIRMED: 'Policy Confirmed - Client Covered'
  };

  // Maps a missing-item label from VettingEngine.gs / PropertyVettingEngine.gs
  // to an uploadable doc key. "Value of Vehicle not provided", "Value of
  // Contents not provided" and "Contents for Residential not provided"
  // have no match on purpose - those are typed answers on the form, not
  // documents, so there's nothing to upload here for them; they still
  // show as plain missing text, no button.
  function missingItemToDocKey(item) {
    var lower = item.toLowerCase();
    if (lower.indexOf('dp licence') !== -1) return 'dpLicence';
    if (lower.indexOf('certified copy') !== -1) return 'certifiedCopy';
    if (lower.indexOf('proof of address') !== -1) return 'proofOfAddress';
    if (lower.indexOf('ncd letter') !== -1) return 'ncdLetter';
    if (lower.indexOf('claim history letter') !== -1) return 'claimHistoryLetter';
    if (lower.indexOf('certificate of registration') !== -1) return 'certOfRegistration';
    if (lower.indexOf('directors id') !== -1) return 'directorsIdDp';
    if (lower.indexOf('property image') !== -1) return 'propertyImage';
    if (lower.indexOf('property evaluation report') !== -1) return 'propertyEvaluationReport';
    return null;
  }

  function renderLineFilter() {
    var host = $('agent-line-filter');
    host.innerHTML = '';
    LINES.forEach(function (line) {
      var active = line.key === state.lineFilter;
      var btn = document.createElement('button');
      btn.textContent = line.label;
      btn.className = 'text-xs font-medium px-3 py-1.5 rounded-full border ' +
        (active ? 'bg-aral-dark text-white border-aral-dark' : 'bg-white text-slate-600 border-slate-300');
      btn.addEventListener('click', function () {
        state.lineFilter = line.key;
        renderLineFilter();
        renderList();
      });
      host.appendChild(btn);
    });
  }

  function visibleRecords() {
    if (state.lineFilter === 'ALL') return state.records;
    return state.records.filter(function (r) { return r.line === state.lineFilter; });
  }

  function renderList() {
    var host = $('agent-list');
    host.innerHTML = '';
    var records = visibleRecords();
    $('agent-empty').classList.toggle('hidden', records.length > 0);

    records.forEach(function (r) {
      var card = document.createElement('div');
      card.className = 'bg-white border border-slate-200 rounded-lg p-4 shadow-sm';
      card.innerHTML =
        '<div class="flex items-start justify-between gap-2">' +
          '<div><div class="font-semibold text-slate-900">' + escapeHtml(r.clientName || 'Unnamed client') + '</div>' +
          '<div class="text-xs text-slate-400">' + escapeHtml(r.aralCode) + ' &middot; ' + escapeHtml(r.line === 'PROPERTY' ? 'Property' : 'Motor') + ' &middot; ' + escapeHtml(r.categoryLabel) + '</div></div>' +
          '<span class="text-xs font-medium px-2 py-1 rounded-full ' + statusColor(r.status) + '">' + r.score + '%</span>' +
        '</div>' +
        '<div class="mt-2 text-xs font-medium ' + statusColor(r.status) + ' inline-block px-2 py-0.5 rounded-full">' + escapeHtml(r.status) + '</div>';

      if (r.missing && r.missing.length) {
        var list = document.createElement('div');
        list.className = 'mt-3 space-y-2';
        r.missing.forEach(function (item) {
          var docKey = missingItemToDocKey(item);
          var row = document.createElement('div');
          row.className = 'flex items-center justify-between text-sm bg-rose-50 border border-rose-100 rounded-md px-2 py-1.5';
          row.innerHTML = '<span class="text-rose-700">' + escapeHtml(docKey ? DOC_LABELS[docKey] + ' missing' : item) + '</span>';
          if (docKey) {
            var btn = document.createElement('button');
            btn.textContent = 'Upload';
            btn.className = 'text-xs font-medium px-2 py-1 rounded-md bg-rose-600 text-white';
            btn.addEventListener('click', function () { startUpload(r.line, r.aralCode, docKey); });
            row.appendChild(btn);
          }
          list.appendChild(row);
        });
        card.appendChild(list);
      }

      var stageSection = renderPolicyStageSection(r);
      if (stageSection) card.appendChild(stageSection);

      if (r.folderUrl) {
        var link = document.createElement('a');
        link.href = r.folderUrl;
        link.target = '_blank';
        link.className = 'block mt-3 text-xs text-sky-600 underline';
        link.textContent = 'View Drive folder';
        card.appendChild(link);
      }

      host.appendChild(card);
    });
  }

  /** Builds the "what's next" box for a card based on Policy Stage - only shown once a submission is Ready/past vetting. */
  function renderPolicyStageSection(r) {
    if (!r.policyStage) return null;
    var box = document.createElement('div');
    box.className = 'mt-3 bg-aral-light/10 border border-aral-light rounded-md p-3 space-y-2';

    if (r.policyStage === POLICY_STAGE.FORMS_SENT) {
      box.innerHTML = '<p class="text-xs text-aral-dark font-medium">Application forms sent - awaiting the client\'s signature.</p>';
      if (r.signedDocUrl) {
        box.innerHTML += '<a href="' + r.signedDocUrl + '" target="_blank" class="block text-xs text-sky-600 underline">Open the application document</a>';
      }
      var signedOnlineBtn = document.createElement('button');
      signedOnlineBtn.textContent = 'Client signed online';
      signedOnlineBtn.className = 'text-xs font-medium px-2 py-1 rounded-md bg-aral-dark text-white mr-2';
      signedOnlineBtn.addEventListener('click', function () { markFormsSigned(r); });
      box.appendChild(signedOnlineBtn);
      var uploadScanBtn = document.createElement('button');
      uploadScanBtn.textContent = 'Upload signed scan instead';
      uploadScanBtn.className = 'text-xs font-medium px-2 py-1 rounded-md border border-aral-dark text-aral-dark';
      uploadScanBtn.addEventListener('click', function () { startUpload(r.line, r.aralCode, 'signedApplication'); });
      box.appendChild(uploadScanBtn);
      return box;
    }

    if (r.policyStage === POLICY_STAGE.SIGNED_PENDING_APPROVAL) {
      box.innerHTML = '<p class="text-xs text-aral-dark font-medium">Signed application submitted - awaiting ARAL approval.</p>';
      return box;
    }

    if (r.policyStage === POLICY_STAGE.APPROVED_PENDING_PAYMENT) {
      box.innerHTML = '<p class="text-xs text-aral-dark font-medium">Approved! Client can pay via the TATIL payment link in their email.</p>';
      var uploadProofBtn = document.createElement('button');
      uploadProofBtn.textContent = 'Upload payment proof';
      uploadProofBtn.className = 'text-xs font-medium px-2 py-1 rounded-md bg-aral-dark text-white';
      uploadProofBtn.addEventListener('click', function () { startUpload(r.line, r.aralCode, 'paymentProof'); });
      box.appendChild(uploadProofBtn);
      return box;
    }

    if (r.policyStage === POLICY_STAGE.PAYMENT_PENDING_CONFIRMATION) {
      box.innerHTML = '<p class="text-xs text-aral-dark font-medium">Payment proof submitted - awaiting ARAL confirmation.</p>';
      return box;
    }

    if (r.policyStage === POLICY_STAGE.POLICY_CONFIRMED) {
      box.innerHTML = '<p class="text-xs text-aral-dark font-medium">&#127881; Policy confirmed' +
        (r.tatilPolicyNumber ? ' - TATIL ' + escapeHtml(r.tatilPolicyNumber) : '') + '. Client is covered.</p>';
      return box;
    }

    return null;
  }

  function markFormsSigned(record) {
    if (!confirm('Confirm the client has signed and saved the application online?')) return;
    google.script.run.withSuccessHandler(loadRecords).withFailureHandler(handleError).agent_markFormsSigned(record.line, record.aralCode);
  }

  function handleError(err) {
    alert('Error: ' + (err && err.message ? err.message : err));
  }

  function loadRecords() {
    google.script.run.withSuccessHandler(function (records) {
      state.records = records;
      renderList();
    }).withFailureHandler(handleError).agent_getMySubmissions(state.email);
  }

  function startUpload(line, aralCode, docKey) {
    state.pendingUpload = { line: line, aralCode: aralCode, docKey: docKey };
    $('agent-file-input').click();
  }

  $('agent-file-input').addEventListener('change', function (evt) {
    var file = evt.target.files[0];
    var pending = state.pendingUpload;
    if (!file || !pending) return;
    var reader = new FileReader();
    reader.onload = function () {
      var base64 = reader.result.split(',')[1];
      google.script.run.withSuccessHandler(function () {
        loadRecords();
      }).withFailureHandler(function (err) {
        alert('Upload failed: ' + (err && err.message ? err.message : err));
      }).agent_reuploadDocument(pending.line, pending.aralCode, pending.docKey, base64, file.name, file.type || 'application/octet-stream');
    };
    reader.readAsDataURL(file);
    evt.target.value = '';
  });

  $('agent-email-save').addEventListener('click', function () {
    var val = $('agent-email-input').value.trim();
    if (!val) return;
    state.email = val;
    try { localStorage.setItem('aral_agent_email', val); } catch (e) {}
    $('agent-email-card').classList.add('hidden');
    loadRecords();
  });

  var detected = window.ARAL_CONTEXT && window.ARAL_CONTEXT.viewerEmail;
  var saved = '';
  try { saved = localStorage.getItem('aral_agent_email') || ''; } catch (e) {}
  state.email = detected || saved;

  renderLineFilter();

  if (!state.email) {
    $('agent-email-card').classList.remove('hidden');
  } else {
    loadRecords();
  }

  setInterval(function () { if (state.email) loadRecords(); }, 60000);
})();
</script>
