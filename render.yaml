services:
  - type: web
    name: genassist
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: genassist-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        value: amii.aral@enbfocus.com
